services:
  mts:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./resources:/app/resources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
